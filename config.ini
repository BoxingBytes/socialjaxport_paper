[base]
envs = common_harvest

[env]
num_agents = 7
report_interval = 1
beam_blocks_movement = True
differentiate_other_agents_in_obs = True
rng = 0                           ; kwarg name is rng in binding.c; overwritten per run by schelling.py

[schelling]
num_agents = 7
num_seeds = 10
episodes_per_seed = 1
cooperator_neighbor_threshold = 3 ; with the never-step-on-an-ineligible-apple guard, 3 sustains the commons
defector_neighbor_threshold = 1   ; 1 keeps the defector from eating the last apple of a cluster
seed_base = 1
